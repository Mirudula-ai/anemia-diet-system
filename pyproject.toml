[project]
name = "anemia-diet-system"
version = "0.1.0"
description = "Multi-agent anemia/iron-deficiency diet recommendation system using CrewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.5,<2.0.0",
    "litellm<=1.82.6",
    "pydantic>=2.0.0",
    "pytest>=8",
    "python-dotenv",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.35.0",
    "requests>=2.31.0",
    "deep-translator>=1.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
anemia-diet = "anemia_diet_system.main:run"
safety-crew = "anemia_diet_system.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anemia_diet_system"]

[tool.crewai]
type = "flow"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
