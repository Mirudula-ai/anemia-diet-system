track_symptom_trends_task:
  description: >
    Compare this week's logged symptoms (symptom_log) to prior weeks (symptom_log_history) and produce a list of recurring symptoms with their classification: "new_acute" if it appears for the first time this week, or "stable_chronic" if it was present in prior weeks as well. If symptom_log_history is empty, return an empty list under `symptom_trends`.
  expected_output: >
    A JSON object with a single key `symptom_trends` containing a list of objects, each with:
      - `symptom` (string)
      - `status` ("new_acute" or "stable_chronic")
  agent: symptom_trend_agent
  context: []

generate_adherence_feedback_task:
  description: >
    Analyze the adherence_summary (from the Feedback & Adaptation Crew) and the feedback_log to detect a clear pattern of missed meals or repeated issues. If a genuine pattern is found, output a single encouraging note describing the pattern (e.g., "You've skipped the iron‑rich breakfast three days this week"). If no pattern is evident, output an empty string under `adherence_note`.
  expected_output: >
    A JSON object with a single key `adherence_note` (string). Empty string when no pattern.
  agent: feedback_adherence_agent
  context: []

synthesize_final_output_task:
  description: >
    Merge the diet plan, safety tier/message, biomarker observations, symptom trends, and adherence note into a single structured output. Follow the hard rule: if `safety_tier` is "URGENT" or "EMERGENCY", set `content_mode` to "safety_override" and include only the safety_note (full safety_message) with no plan or other content. Otherwise, include the plan slots (morning, afternoon_evening, night) and optional safety_note, and always end with the closing line.
  expected_output: >
    {
      "safety_tier": "NONE|MONITOR|URGENT|EMERGENCY",
      "content_mode": "full_plan" | "safety_override",
      "morning": [] | null,
      "afternoon_evening": [] | null,
      "night": [] | null,
      "safety_note": "..." | null,
      "closing_line": "This is food-based support, not a diagnosis." | null
    }
  agent: synthesis_agent
  context:
    - track_symptom_trends_task
    - generate_adherence_feedback_task
